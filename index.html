<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundo de galáxia interativo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #galaxy-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    overflow: hidden;
  }

  #galaxy-container.dragging {
    cursor: grabbing;
  }

  #galaxy-layer {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    will-change: transform;
  }

  .light-point {
    position: absolute;
    border-radius: 80%;
    cursor: pointer;
    transform: translate(-50%, -50%);
  }

  .light-point .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 100%;
    background: #fff;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 8px 2px rgba(255,255,255,0.9),
      0 0 20px 8px rgba(140,180,255,0.5),
      0 0 40px 16px rgba(140,180,255,0.2);
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }

  .light-point:hover .core {
    transform: translate(-50%, -50%) scale(1.6);
    box-shadow:
      0 0 12px 4px rgba(255,255,255,1),
      0 0 30px 14px rgba(180,210,255,0.7),
      0 0 60px 24px rgba(140,180,255,0.35);
  }

  .light-point .label {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: #fff;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    background: rgba(10,12,25,0.7);
    padding: 20px 8px;
    border-radius: 4px;
    transition: opacity 0.25s ease;
  }

  .light-point:hover .label {
    opacity: 1;
  }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    letter-spacing: 0.02em;
    user-select: none;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
</style>
</head>
<body>

<div id="galaxy-container">
  <canvas id="stars-canvas"></canvas>
  <div id="galaxy-layer"></div>
</div>
<div id="hint">arraste para explorar · clique nos pontos de luz</div>

<script>
(function () {
  const container = document.getElementById('galaxy-container');
  const layer = document.getElementById('galaxy-layer');
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  // ---- CONFIGURE AQUI OS PONTOS DE LUZ E SEUS LINKS ----
  const points = [
    { x: 0.30, y: 0.35, label: 'Projetos',  url: 'https://example.com/projetos' },
    { x: 0.65, y: 0.20, label: 'Sobre mim', url: 'https://example.com/sobre' },
    { x: 0.50, y: 0.60, label: 'Contato',   url: 'https://example.com/contato' },
    { x: 0.20, y: 0.70, label: 'Blog',      url: 'https://example.com/blog' },
    { x: 0.80, y: 0.55, label: 'GitHub',    url: 'https://github.com' }
  ];
  // -------------------------------------------------------

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  resize();
  window.addEventListener('resize', resize);

  // Gera campo de estrelas de fundo (estático, desenhado uma vez por resize)
  let stars = [];
  function generateStars() {
    stars = [];
    const count = Math.floor((width * height) / 1800);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * width * 2 - width * 0.5,
        y: Math.random() * height * 2 - height * 0.5,
        r: Math.random() * 1.3 + 0.2,
        alpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }
  }
  generateStars();
  window.addEventListener('resize', generateStars);

  // Posição de arraste (pan) da galáxia
  let panX = 0, panY = 0;
  let isDragging = false;
  let startX = 0, startY = 0;
  let lastPanX = 0, lastPanY = 0;

  // Limites de quanto se pode arrastar (ajuste conforme quiser mais/menos liberdade)
  const PAN_LIMIT = 600;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function applyTransform() {
    layer.style.transform = `translate(${panX}px, ${panY}px)`;
  }

  function pointerDown(x, y) {
    isDragging = true;
    startX = x;
    startY = y;
    lastPanX = panX;
    lastPanY = panY;
    container.classList.add('dragging');
    hint.style.opacity = '0';
  }

  function pointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - startX;
    const dy = y - startY;
    panX = clamp(lastPanX + dx, -PAN_LIMIT, PAN_LIMIT);
    panY = clamp(lastPanY + dy, -PAN_LIMIT, PAN_LIMIT);
    applyTransform();
  }

  function pointerUp() {
    isDragging = false;
    container.classList.remove('dragging');
  }

  // Mouse
  container.addEventListener('mousedown', (e) => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  // Touch
  container.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  container.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  container.addEventListener('touchend', pointerUp);

  // Renderiza pontos de luz clicáveis (posicionados relativos ao layer, então
  // se movem junto com o arraste)
  function renderPoints() {
    points.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'light-point';
      el.style.left = (p.x * 100) + '%';
      el.style.top = (p.y * 100) + '%';

      const core = document.createElement('div');
      core.className = 'core';
      el.appendChild(core);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = p.label;
      el.appendChild(label);

      let downX, downY, moved;
      el.addEventListener('mousedown', (e) => {
        downX = e.clientX; downY = e.clientY; moved = false;
        e.stopPropagation();
      });
      el.addEventListener('mousemove', (e) => {
        if (Math.abs(e.clientX - downX) > 5 || Math.abs(e.clientY - downY) > 5) moved = true;
      });
      el.addEventListener('mouseup', (e) => {
        e.stopPropagation();
        if (!moved) window.open(p.url, '_blank');
      });

      el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      el.addEventListener('touchend', (e) => {
        e.stopPropagation();
        window.open(p.url, '_blank');
      });

      layer.appendChild(el);
    });
  }
  renderPoints();

  // Loop de animação: desenha estrelas com leve cintilação e paralaxe
  let frame = 0;
  function draw() {
    frame++;
    ctx.clearRect(0, 0, width, height);

    stars.forEach((s) => {
      // fator de paralaxe leve baseado na "profundidade" simulada pelo raio
      const parallax = 0.15 + s.r * 0.1;
      const sx = s.x + panX * parallax + width * 0.5;
      const sy = s.y + panY * parallax + height * 0.5;

      const twinkle = Math.sin(frame * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(sx % (width * 2) - width * 0.5, sy % (height * 2) - height * 0.5, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.alpha * twinkle})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>
